name: Update Linux visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-linux-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Regenerate Linux baselines
        run: npx playwright test e2e/5-visual-regression.spec.ts --update-snapshots
        env:
          E2E_TARGET: preview
          HOME: /root

      - name: Commit Linux baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/5-visual-regression.spec.ts-snapshots/*-linux.png
          if git diff --cached --quiet; then
            echo "Linux baselines are already up to date."
          else
            git commit -m "Update Linux visual baselines"
            git push
          fi
